    <title>Hero Block with Video</title>
    <meta name="description" content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">
    <!-- Link to Tailwind CSS -->

    <!-- Custom styles -->
    <style type="text/tailwindcss">

       header {
        @apply relative
 min-h-[60vh] md:min-h-[80vh]
        flex flex-col justify-center
        px-8 lg:px-60 py-12
        text-center overflow-hidden;
}
header video {
    @apply absolute inset-0 w-full h-full
           object-cover object-center md:object-top;
    z-index: 0;
}

header {
    @apply relative;
}

header::before {
    content: "";
    @apply absolute inset-0;
    background: linear-gradient(
        to bottom,
        rgba(23, 37, 84, 0.7),
        rgba(131, 24, 67, 0.3)
    );
    z-index: 1;
}

header h1,
header h2 {
    @apply relative z-10;
}

        header h1 {
            @apply text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
            mb-6;
        }

        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }
        .slide-in-top {
	-webkit-animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
	        animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

/**
 * ----------------------------------------
 * animation slide-in-top

 */
@-webkit-keyframes slide-in-top {
  0% {
    -webkit-transform: translateY(-1000px);
            transform: translateY(-1000px);
    opacity: 0;
  }
  100% {
    -webkit-transform: translateY(0);
            transform: translateY(0);
    opacity: 1;
  }

     <header>

        autoplay

        loop

            src="assets/videos/hero-video.mp4"
